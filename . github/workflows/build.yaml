name: Build Alice 103 - Verde
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-tudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Limpa tudo que esta velho
        run: |
          rm -rf android web
          flutter create . --platforms=android,web --project-name controle_alice --org com.jcobl.alice --overwrite
          echo "--- settings.gradle ---"
          cat android/settings.gradle | grep -i kotlin || true
          echo "--- build.gradle ---"
          cat android/build.gradle | grep -i kotlin || true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Build WEB
        run: flutter build web --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-alice-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-alice-web
          path: build/web
