name: Build APK Alice
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
      - name: Build direto sem recriar Android
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name controle_alice --platforms=android --no-pub
          fi
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-alice-release
          path: build/app/outputs/flutter-apk/app-release.apk
