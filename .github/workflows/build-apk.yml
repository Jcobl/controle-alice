name: Build APK Alice
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Salvar seus arquivos
        run: |
          mkdir -p /tmp/save
          cp lib/main.dart /tmp/save/main.dart 2>/dev/null || echo "sem main"
          cp pubspec.yaml /tmp/save/pubspec.yaml 2>/dev/null || echo "sem pubspec"
      - name: Garantir android sem apagar nada
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name controle_alice --platforms=android --no-pub
          fi
      - name: Restaurar seus arquivos
        run: |
          cp /tmp/save/main.dart lib/main.dart 2>/dev/null || echo "restaura main falhou"
          cp /tmp/save/pubspec.yaml pubspec.yaml 2>/dev/null || echo "restaura pubspec falhou"
          ls -la lib/
          cat pubspec.yaml
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-alice-release
          path: build/app/outputs/flutter-apk/app-release.apk
