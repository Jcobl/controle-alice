name: Build Alice iOS + Android + Web V103
on:
  push:
    branches: [ main, master ]
jobs:
  build-android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - run: flutter build web --release --base-href /controle-alice/
      - uses: actions/upload-artifact@v4
        with:
          name: app-alice-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: 'stable'
      - run: |
          if [ ! -d "ios" ]; then
            flutter create . --platforms=ios --project-name controle_alice
          fi
      - run: flutter pub get
      - run: flutter build ios --no-codesign --release --no-tree-shake-icons || echo "ok"
  deploy-pages:
    needs: build-android-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-alice-web
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        id: deployment
