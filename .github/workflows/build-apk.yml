name: Build Alice 103 - Verde
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Conserta Gradle antigo
        run: |
          rm -rf android
          flutter create . --platforms=android,web --project-name controle_alice
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-alice-release
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Conserta Web se faltar
        run: |
          rm -rf web
          flutter create . --platforms=web --project-name controle_alice
      - run: flutter pub get
      - run: flutter build web --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-alice-web
          path: build/web