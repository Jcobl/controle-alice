name: Build Alice Roblox 1040 Gemini 1GB VERDE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Gera 1GB de assets
        run: |
          mkdir -p assets/imagens assets/sons assets/videos assets/jogos assets/historias
          # 100 arquivos de 10MB = 1GB
          for i in $(seq 1 100); do
            FILE=assets/imagens/fundo_${i}.bin
            if [ ! -f "$FILE" ]; then
              dd if=/dev/urandom of=$FILE bs=1M count=10 status=none
            fi
          done
          echo "Total assets:"
          du -sh assets
          ls assets/imagens | wc -l

      - name: Cria projeto Android/Web limpo
        run: |
          rm -rf android web
          flutter create . --platforms=android,web --project-name controle_alice
          # Força Kotlin 1.9.22 que é o que fica verde
          sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          cat android/build.gradle | grep kotlin

      - name: Aumenta memória do Gradle para 1GB APK
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.aapt2FromMavenOverride=" >> android/gradle.properties
          cat android/gradle.properties

          # Não comprimir .bin para não estourar AAPT
          # Adiciona noCompress no build.gradle
          if ! grep -q "noCompress" android/app/build.gradle; then
            echo "android { packagingOptions { jniLibs { useLegacyPackaging true } } aaptOptions { noCompress 'bin' } }" >> android/app/build.gradle
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build APK 1GB com Gemini Secret
        env:
          GRADLE_OPTS: "-Xmx4096m -Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} -v

      - name: Build Web
        run: flutter build web --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Alice-Roblox-1040-1GB-VERDE
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Alice-Web-1040-VERDE
          path: build/web
