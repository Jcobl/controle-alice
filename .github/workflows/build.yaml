name: Build Alice Roblox 1040 Gemini 1GB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Gera 1GB assets para APK
        run: |
          mkdir -p assets/imagens assets/sons assets/videos assets/jogos assets/historias
          for i in $(seq 1 100); do
            FILE=assets/imagens/fundo_${i}.bin
            [ -f "$FILE" ] || dd if=/dev/urandom of=$FILE bs=1M count=10 status=none
          done
          echo "Gerado:" && du -sh assets && ls assets/imagens | wc -l

      - name: Corrige projeto Flutter
        run: |
          rm -rf android web
          flutter create . --platforms=android,web --project-name controle_alice
          flutter pub get

      - name: Build APK 1GB com Gemini Secret
        run: |
          flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build Web
        run: flutter build web --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Alice-Roblox-1040-1GB-Gemini
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Alice-Web-Roblox-1040
          path: build/web
