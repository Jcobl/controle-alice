name: Build Alice VERDE FINAL TUDO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Restaura projeto sem apagar main
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android web
          flutter create . --platforms=android,web --project-name controle_alice --overwrite
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.22'/" android/build.gradle || true

      - name: Gera 1GB assets DEPOIS do create
        run: |
          mkdir -p assets/imagens assets/sons assets/videos assets/jogos assets/historias
          for i in $(seq 1 100); do
            FILE=assets/imagens/fundo_${i}.bin
            if [ ! -f "$FILE" ]; then
              dd if=/dev/urandom of=$FILE bs=1M count=10 status=none
            fi
          done
          du -sh assets

      - name: Aumenta memoria Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Pub get
        run: flutter pub get

      - name: Build APK 1GB com Gemini Secret
        env:
          GRADLE_OPTS: "-Xmx4096m"
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build Web
        run: flutter build web --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Alice-VERDE-FINAL-1GB-TUDO
          path: build/app/outputs/flutter-apk/app-release.apk
