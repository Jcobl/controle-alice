name: Build Alice VERDE FINAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Restaura sem apagar main
        run: |
          cp lib/main.dart /tmp/m.bak
          cp pubspec.yaml /tmp/p.bak
          rm -rf android web
          flutter create . --platforms=android,web --project-name controle_alice --overwrite
          cp /tmp/m.bak lib/main.dart
          cp /tmp/p.bak pubspec.yaml

      - name: Permissao internet
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q INTERNET $FILE; then
            sed -i 's/<application/    <uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' $FILE
          fi

      - name: Gradle 4GB
        run: echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties

      - name: Gera 1GB
        run: |
          mkdir -p assets/imagens
          for i in $(seq 1 100); do
            dd if=/dev/urandom of=assets/imagens/fundo_${i}.bin bs=1M count=10 status=none 2>/dev/null || true
          done

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Alice-VERDE-FINAL-1GB
          path: build/app/outputs/flutter-apk/app-release.apk
