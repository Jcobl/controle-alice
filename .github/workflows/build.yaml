name: Build Alice Roblox 1040 Gemini 1GB VERDE FINAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Gera 1GB de assets
        run: |
          mkdir -p assets/imagens assets/sons assets/videos assets/jogos assets/historias
          for i in $(seq 1 100); do
            FILE=assets/imagens/fundo_${i}.bin
            if [ ! -f "$FILE" ]; then
              dd if=/dev/urandom of=$FILE bs=1M count=10 status=none
            fi
          done
          du -sh assets

      - name: Cria projeto Android/Web limpo SEM APAGAR main.dart
        run: |
          # Backup do seu main.dart com 1040 + IA + historias
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android web
          flutter create . --platforms=android,web --project-name controle_alice --overwrite
          # Restaura seu main e pubspec
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Kotlin 1.9.22 verde
          sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          ls -lh lib/main.dart

      - name: Aumenta memória Gradle 1GB
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          cat android/gradle.properties

      - name: Pub get
        run: flutter pub get

      - name: Build APK 1GB com Gemini Secret
        env:
          GRADLE_OPTS: "-Xmx4096m"
        run: |
          flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Build Web
        run: flutter build web --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Alice-Roblox-1040-1GB-VERDE-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Alice-Web-1040-VERDE-FINAL
          path: build/web
